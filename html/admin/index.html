<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Trident Dental Lab — Quản trị</title>
<link rel="icon" href="data:,">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b2545; }
  :root { --gg-warning-height: 25px; } /* chiều cao thanh cảnh báo của Google; đổi giao diện thì sửa số này */
  .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
  .cms-frame {
    position: absolute; left: 0; border: 0; display: block;
    top: calc(var(--gg-warning-height) * -1);
    width: 100%; height: calc(100% + var(--gg-warning-height));
  }
  .status {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #0b2545; color: #fff; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .status.hidden { display: none; }
  .status .box { max-width: 420px; }
  .status h1 { font-size: 18px; margin: 0 0 8px; font-weight: 700; }
  .status p { font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,.75); margin: 0 0 18px; }
  .status a {
    display: inline-block; padding: 10px 18px; border-radius: 9px;
    background: #2f6fed; color: #fff; text-decoration: none; font-weight: 600; font-size: 13.5px;
  }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 16px;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #fff;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="status" id="status">
    <div class="box">
      <div class="spinner" id="spinner"></div>
      <h1 id="status-title">Đang mở trang quản trị…</h1>
      <p id="status-msg">Vui lòng chờ trong giây lát.</p>
      <a id="status-link" href="/admin-gas/" hidden rel="nofollow noreferrer">Mở ở cửa sổ khác</a>
    </div>
  </div>

  <div class="cms-viewport">
    <iframe class="cms-frame" id="cms-frame" title="Trident Dental Lab — Quản trị"></iframe>
  </div>

  <script>
    (function () {
      var CMS_URL = "https://script.google.com/macros/s/AKfycbxeDVsRryUtxXksfy08UX2HowWjKfJjAuaJ4inwNNJpO5Qnnxj31j7quhrsnyFuRBszAg/exec";
      var frame = document.getElementById("cms-frame");
      var status = document.getElementById("status");
      var spinner = document.getElementById("spinner");
      var link = document.getElementById("status-link");
      var loaded = false;

      frame.addEventListener("load", function () {
        loaded = true;
        status.classList.add("hidden");
      });

      setTimeout(function () {
        if (loaded) return;
        spinner.style.display = "none";
        document.getElementById("status-title").textContent = "Chưa mở được ở đây";
        document.getElementById("status-msg").textContent =
          "Trình duyệt này đang chặn hiển thị trực tiếp. Mở trang quản trị ở cửa sổ khác:";
        link.hidden = false;
      }, 12000);

      frame.src = CMS_URL;
    })();
  </script>
</body>
</html>
