<!DOCTYPE html>
<html lang="vi">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <title>Trident Dental Lab</title>
    <style>
      <?!= include_('css') ?>
    </style>
  </head>
  <body>
    <div id="fatal-error" hidden></div>

    <!-- LOGIN -->
    <div id="auth" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">Trident <small>Dental Lab</small></div>
        <h1 id="auth-title">Đăng nhập trang quản trị</h1>
        <p class="muted" id="auth-desc">Nhập email đã được cấp quyền để nhận mã đăng nhập.</p>

        <div id="step-email">
          <div class="field">
            <label for="in-email">Email</label>
            <input id="in-email" type="email" autocomplete="email" placeholder="ban@vidu.com" />
          </div>
          <button class="btn block" id="btn-send-code">
            <span class="spin"></span><span class="label">Gửi mã</span>
          </button>
        </div>

        <div id="step-otp" class="hidden">
          <div class="field">
            <label for="in-otp">Mã đăng nhập (gửi tới email)</label>
            <input id="in-otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 chữ số" />
          </div>
          <button class="btn block" id="btn-verify">
            <span class="spin"></span><span class="label">Đăng nhập</span>
          </button>
          <button class="btn ghost block" id="btn-back" style="margin-top:8px">Đổi email</button>
        </div>

        <div class="form-err" id="auth-err"></div>
        <div class="form-ok" id="auth-ok"></div>
      </div>
    </div>

    <!-- APP (markup nạp sau khi đăng nhập) -->
    <div id="app-root" class="hidden"></div>

    <!-- Modal xác nhận -->
    <div class="overlay hidden" id="confirm-overlay">
      <div class="modal confirm-box">
        <p id="confirm-msg"></p>
        <p class="note" id="confirm-note"></p>
        <div class="row">
          <button class="btn ghost" id="confirm-cancel">Huỷ</button>
          <button class="btn danger" id="confirm-ok">Đồng ý</button>
        </div>
      </div>
    </div>

    <!-- Modal thông báo -->
    <div class="overlay hidden" id="alert-overlay">
      <div class="modal confirm-box" id="alert-box">
        <h3 id="alert-title" style="margin:0 0 8px">Thông báo</h3>
        <p id="alert-msg"></p>
        <p class="note" id="alert-note"></p>
        <div class="row">
          <button class="btn" id="alert-close">Đóng</button>
        </div>
      </div>
    </div>

    <!-- Modal chi tiết yêu cầu -->
    <div class="overlay hidden" id="detail-overlay">
      <div class="modal">
        <div class="modal-head">
          <h3 id="detail-title">Chi tiết</h3>
          <button class="x" id="detail-x">&times;</button>
        </div>
        <div class="modal-body">
          <div class="detail-status">
            <label style="font-weight:600;color:var(--ink-soft)">Trạng thái</label>
            <select id="detail-status"></select>
          </div>
          <div id="detail-meta" style="font-size:12px;color:var(--ink-soft);margin:2px 0 12px"></div>
          <table class="kv"><tbody id="detail-kv"></tbody></table>
        </div>
        <div class="modal-actions">
          <button class="btn danger" id="detail-delete"><span class="spin"></span><span class="label">Xoá yêu cầu</span></button>
          <button class="btn ghost" id="detail-close">Đóng</button>
        </div>
      </div>
    </div>

    <script>
      window.CLIENT_BUILD = '<?= clientBuild ?>';
    </script>
    <script>
      <?!= include_('js') ?>
    </script>
  </body>
</html>
