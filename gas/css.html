<style>
:root{
  --navy:#0b2545; --navy-deep:#081a33; --bg:#f4f8fc; --card:#ffffff;
  --ink:#101a2c; --ink-soft:#5b6675; --line:#e2e8f0; --blue:#2f6fed;
  --gold:#c79a3e; --ok:#1f9d55; --warn:#b7791f; --danger:#d64545;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- Fatal error banner ---------- */
#fatal-error{
  position:fixed; inset:0 0 auto 0; z-index:9999; background:#7f1d1d; color:#fff;
  padding:14px 18px; font-size:13px; white-space:pre-wrap;
}

/* ---------- Login ---------- */
.auth-wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px}
.auth-card{
  width:100%; max-width:380px; background:var(--card); border-radius:20px;
  padding:34px 30px; box-shadow:0 30px 60px -36px rgba(11,37,69,.35);
}
.auth-brand{font-weight:800; font-size:19px; color:var(--navy); letter-spacing:.02em; margin-bottom:4px}
.auth-brand small{display:block; font-weight:500; font-size:11px; letter-spacing:.16em; color:var(--ink-soft); text-transform:uppercase}
.auth-card h1{font-size:16px; margin:20px 0 6px}
.auth-card p.muted{color:var(--ink-soft); font-size:12.5px; margin:0 0 18px}
.field{margin-bottom:14px}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px}
.field input{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px;
  background:#fff; outline:none; transition:border-color .15s;
}
.field input:focus{border-color:var(--blue)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:1px solid transparent; font-weight:600;
  background:var(--navy); color:#fff; transition:background .15s, opacity .15s;
}
.btn:hover{background:var(--navy-deep)}
.btn.ghost{background:transparent; color:var(--navy); border-color:var(--line)}
.btn.ghost:hover{background:#eef3f8}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#b93a3a}
.btn.small{padding:7px 12px; font-size:12.5px; border-radius:8px}
.btn[disabled], .btn.is-loading{opacity:.6; pointer-events:none}
.btn.block{width:100%}
.btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.is-loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.form-err{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:1em}
.form-ok{color:var(--ok); font-size:12.5px; margin-top:10px; min-height:1em}
.hidden{display:none !important}

/* ---------- App shell ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 20px; background:var(--navy); color:#fff;
}
.topbar .brand{font-weight:800; letter-spacing:.02em}
.topbar .brand small{font-weight:500; opacity:.7; letter-spacing:.14em; text-transform:uppercase; font-size:10px; margin-left:8px}
.topbar .who{font-size:12.5px; opacity:.85; display:flex; align-items:center; gap:12px}
.topbar .who button{background:rgba(255,255,255,.12); color:#fff; border:0; padding:6px 12px; border-radius:8px; font-size:12px}
.topbar .who button:hover{background:rgba(255,255,255,.22)}

.nav{display:flex; gap:4px; padding:0 16px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto}
.nav button{
  background:transparent; border:0; padding:14px 16px; font-weight:600; color:var(--ink-soft);
  border-bottom:2px solid transparent; white-space:nowrap;
}
.nav button.active{color:var(--navy); border-bottom-color:var(--blue)}
.nav button .count{
  display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px;
  background:var(--blue); color:#fff; font-size:11px; line-height:18px; text-align:center; font-weight:700;
}

.wrap{max-width:1000px; margin:0 auto; padding:22px 20px 60px}
.panel{display:none}
.panel.active{display:block}
.panel h2{font-size:17px; margin:0 0 4px}
.panel .sub{color:var(--ink-soft); font-size:12.5px; margin:0 0 16px}

/* ---------- Filter chips ---------- */
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.chip{
  padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; color:var(--ink-soft);
}
.chip.active{background:var(--navy); color:#fff; border-color:var(--navy)}

/* ---------- Table ---------- */
.table-box{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
table{width:100%; border-collapse:collapse}
th,td{text-align:left; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line)}
th{background:#f7fafd; color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f4f8fc}
tbody tr:last-child td{border-bottom:0}
.empty{padding:34px 14px; text-align:center; color:var(--ink-soft); font-size:13px}
.pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600}
.pill.s-moi{background:#e8f0fe; color:#1a56db}
.pill.s-dang{background:#fef3c7; color:#92400e}
.pill.s-xong{background:#dcfce7; color:#166534}
.pill.s-huy{background:#f1f5f9; color:#64748b}
.cell-sub{display:block; color:var(--ink-soft); font-size:12px}

/* ---------- Users ---------- */
.user-add{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.user-add .field{margin:0; min-width:220px; flex:1}
.user-add select{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:#fff}
.role-tag{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; background:#eef3f8; color:var(--navy)}
.role-tag.root{background:var(--navy); color:#fff}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(8,20,40,.5); display:flex; align-items:center;
  justify-content:center; padding:20px; z-index:1000;
}
.overlay.hidden{display:none}
.modal{
  background:#fff; border-radius:18px; width:100%; max-width:520px; max-height:88vh; overflow:auto;
  box-shadow:0 40px 80px -30px rgba(11,37,69,.5);
}
.modal-head{padding:18px 22px 8px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.modal-head h3{margin:0; font-size:16px}
.modal-head .x{background:transparent; border:0; font-size:20px; line-height:1; color:var(--ink-soft)}
.modal-body{padding:6px 22px 20px}
.modal-actions{padding:14px 22px 20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.kv{width:100%; border-collapse:collapse; margin:4px 0 14px}
.kv td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:12.5px; cursor:auto}
.kv td.k{width:40%; color:var(--ink-soft); font-weight:600; word-break:break-word}
.kv td.v{white-space:pre-wrap; word-break:break-word}
.detail-status{display:flex; align-items:center; gap:10px; margin:4px 0 6px}
.detail-status select{padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#fff}
.confirm-box{max-width:380px; text-align:center; padding:26px 24px}
.confirm-box p{margin:0 0 4px; font-size:14px}
.confirm-box .note{color:var(--ink-soft); font-size:12.5px; font-style:italic}
.confirm-box .row{display:flex; gap:10px; justify-content:center; margin-top:20px}
.alert-message-success h3{color:var(--ok)}
.alert-message-error h3{color:var(--danger)}

@media(max-width:560px){
  .wrap{padding:16px 12px 50px}
  th:nth-child(2), td:nth-child(2){display:none}
}
</style>
